<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A2F24">
<title>V1SU Databases</title>
<style>
:root{color-scheme:light;--green:#0A2F24;--lime:#3DCD58;--pale:#E7FFD9;--paper:#F6FAF6}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background-color:var(--paper);background-image:linear-gradient(rgba(10,47,36,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(10,47,36,.035) 1px,transparent 1px);background-size:32px 32px;color:var(--green);font-family:"Segoe UI",Arial,sans-serif}
.portal{width:min(1160px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.entry{position:relative;display:flex;min-width:0;min-height:440px;flex-direction:column;justify-content:space-between;padding:32px;border:1px solid var(--green);border-radius:4px;text-decoration:none;animation:arrive .45s ease-out both;transition:transform .18s ease,box-shadow .18s ease}
.entry:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(10,47,36,.14)}
.entry:focus-visible{outline:3px solid var(--green);outline-offset:4px}
.entry--sc{background:var(--green);color:#fff;border-inline-start:8px solid var(--lime)}
.entry--ee{background:var(--pale);color:var(--green);border-inline-start:8px solid var(--lime);animation-delay:.08s}
.entry-number{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.entry h2{margin:0;font-size:40px;line-height:1.08;font-weight:750;overflow-wrap:anywhere}
.entry-arrow{align-self:flex-end;font-size:36px;line-height:1}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){body{place-items:start center;padding:16px}.portal{grid-template-columns:1fr;gap:12px}.entry{min-height:270px;padding:24px}.entry h2{font-size:36px}}
@media(prefers-reduced-motion:reduce){.entry{animation:none;transition:none}.entry:hover{transform:none}}
</style>
</head>
<body>
<main class="portal" aria-label="Database selection">
  <h1 class="visually-hidden">V1SU Databases</h1>
  <a class="entry entry--sc" href="SC-Database/" aria-label="Open SC-Database">
    <span class="entry-number">01</span>
    <h2>SC-Database</h2>
    <span class="entry-arrow" aria-hidden="true">&#8599;</span>
  </a>
  <a class="entry entry--ee" href="EE-Database/" aria-label="Open EE-Database">
    <span class="entry-number">02</span>
    <h2>EE-Database</h2>
    <span class="entry-arrow" aria-hidden="true">&#8599;</span>
  </a>
</main>
</body>
</html>
